<!DOCTYPE html><html lang="ja"><head><meta charset="UTF-8"><title>OG source</title><link href="https://fonts.googleapis.com/css2?family=Noto+Sans+JP:wght@400;700;900&display=swap" rel="stylesheet"><style>
*{box-sizing:border-box}
html,body{margin:0;padding:0}
body{width:1200px;height:630px;background:#fff;font-family:'Noto Sans JP',sans-serif;position:relative;overflow:hidden}
.pad{padding:64px 72px}
.kicker{font-size:20px;letter-spacing:.12em;color:#126981;font-weight:700;margin:0 0 20px}
h1{font-size:72px;font-weight:900;line-height:1.25;margin:0 0 40px;color:#141b21}
.lime-mark{background:linear-gradient(transparent 62%,#D6F034 62%,#D6F034 88%,transparent 88%)}
.list{display:flex;flex-direction:column;gap:14px}
.row{display:flex;align-items:center;gap:20px}
.pill{display:inline-block;padding:6px 22px;border-radius:999px;font-weight:700;font-size:26px;color:#153f4b;white-space:nowrap}
.pill-free{background:#eef2f3}
.pill-ume{background:#f3dce3}
.pill-take{background:#c5eff8}
.pill-matsu{background:#d1e6dc}
.desc{font-size:26px;color:#6b6b76}
.brand{position:absolute;right:72px;bottom:40px;font-size:20px;color:#6b6b76}
</style></head><body><div class="pad">
<p class="kicker">耳で覚える宅建 2027</p>
<h1><span class="lime-mark">続けるための学習サポート</span></h1>
<div class="list">
<div class="row"><span class="pill pill-free">学習便</span><span class="desc">毎週、図解と問題が届く</span></div>
<div class="row"><span class="pill pill-ume">学習カルテ</span><span class="desc">弱点が見える記録</span></div>
<div class="row"><span class="pill pill-take">学習ナビ</span><span class="desc">今週やることを決める</span></div>
<div class="row"><span class="pill pill-matsu">伴走</span><span class="desc">担当者がついて10週間</span></div>
</div>
</div><p class="brand">mimiobo.com</p></body></html>
