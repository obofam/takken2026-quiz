<div data-slot="cards1">
<div class="tx" data-fig="2"><figure class="fig">
    <div class="cap"><span class="n">2</span>誰に？　誰が？<span class="capsub">手術の前の説明と同意にたとえると</span></div>
    <div class="who">
      <div class="wh s2">誰に説明する</div><div class="wh">誰が説明する</div>
      <div class="wc no"><svg class="ic" viewBox="0 0 48 48"><circle cx="24" cy="15" r="8" fill="#fff" stroke="#5A626B" stroke-width="2.5"/><path d="M9 43 C9 30 39 30 39 43" fill="#fff" stroke="#5A626B" stroke-width="2.5" stroke-linejoin="round"/></svg>売主・貸主<span class="pill ng">説明しない</span><small>手術を受けない人</small></div>

<div data-slot="cards2">
<div class="tx" data-fig="5"><figure class="fig">
    <div class="cap"><span class="n">5</span>船のたとえで、2つの箱に分ける<span class="capsub">全部覚えるより、分かれ目を覚える</span></div>
    <div class="row" style="gap:12px">
      <div class="box out">
        <div class="bh"><svg viewBox="0 0 56 48"><path d="M28 5 V29" stroke="#5A626B" stroke-width="2.5" stroke-linecap="round"/><path d="M31 8 L47 26 H31 Z" fill="#fff" stroke="#5A626B" stroke-width="2.5" stroke-linejoin="round"/><path d="M25 13 L11 26 H25 Z" fill="#fff" stroke="#5A626B" stroke-width="2.5" stroke-linejoin="round"/><path d="M5 31 H51 L44 43 H12 Z" fill="#fff" stroke="#5A626B" stroke-width="2.5" stroke-linejoin="round"/></svg><div><b>船を持つ人の側</b><small>建物を借りる人には、外れる</small></div></div>
        <span class="why">持ち主になるわけではないから</span>
        <ul class="bl">
          <li>私道の負担</li>
          <li>法令上の制限<small>（大半）</small></li>
          <li>手付金等の保全・ローンのあっせん</li>
          <li>住宅性能評価<small>（新築）</small></li>
          <li>書類の保存状況<small>（既存の建物）</small></li>
        </ul>
      </div>
      <div class="box in">
        <div class="bh"><svg viewBox="0 0 56 48"><circle cx="28" cy="24" r="18" fill="#E3F8FC" stroke="#0A6477" stroke-width="2.5"/><circle cx="28" cy="24" r="7" fill="#fff" stroke="#0A6477" stroke-width="2.5"/><path d="M15.3 11.3 L23 19 M40.7 11.3 L33 19 M15.3 36.7 L23 29 M40.7 36.7 L33 29" stroke="#0A6477" stroke-width="5"/></svg><div><b>救命ボートの側</b><small>建物を借りる人にも、残る</small></div></div>
        <span class="why">住む人の安全だから</span>
        <ul class="bl">
          <li>災害の区域<small>（造成宅地防災区域・土砂災害警戒区域・津波災害警戒区域）</small></li>
          <li>水害ハザードマップでの所在地</li>
          <li>石綿の調査記録<small>（建物）</small></li>
          <li>耐震診断<small>（建物）</small></li>
          <li>建物状況調査<small>（既存の建物）</small></li>
        </ul>
      </div>
    </div>
    <div class="chips">
      <div class="chip"><b>どちらでも説明する</b>：<span class="nw">登記された権利（抹消予定でも）</span>／<span class="nw">代金・借賃以外の金銭</span>／<span class="nw">解除・違約金</span>／<span class="nw">飲用水・電気・ガス・排水</span>／<span class="nw">支払金・預り金</span>。<span class="nw">35条1項の各号は<b>「少なくとも」</b>の最低限のリスト</span></div>
    </div>
  </figure></div>
