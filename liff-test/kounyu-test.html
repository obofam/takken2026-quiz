<!DOCTYPE html>
<html lang="ja">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<meta name="robots" content="noindex, nofollow">
<title>購入テスト｜耳で覚える宅建2027</title>
<style>
:root{--sky:#17C5E8;--ink:#0A6477;--soft:#E3F8FC;--bg:#F4FAFC;--text:#141B21;--sub:#5B5B66;--line:#DCEEF3;--lime:#D6F034;--lime-soft:#F4FBD2;--lime-dark:#4F6300;--font:"Noto Sans JP","Hiragino Sans","Yu Gothic",sans-serif;}
*{box-sizing:border-box}
body{margin:0;background:#fff;color:var(--text);font-family:var(--font);font-size:16px;line-height:1.7}
.band{background:var(--soft);color:var(--ink);font-size:16px;text-align:center;padding:6px 12px;border-bottom:1px solid var(--line)}
main{max-width:560px;margin:0 auto;padding:20px 16px 48px}
h1{font-size:22px;margin:8px 0 16px}
h2{font-size:18px;margin:28px 0 10px;color:var(--ink)}
.card{border:1px solid var(--line);border-radius:12px;padding:14px 16px;background:#fff;margin:0 0 12px}
.row{display:flex;align-items:center;justify-content:space-between;gap:12px;flex-wrap:wrap}
.name{font-weight:700}
.price{color:var(--sub)}
button{min-height:44px;min-width:44px;padding:8px 18px;font:inherit;font-weight:700;color:#fff;background:var(--ink);border:0;border-radius:10px;cursor:pointer}
button[disabled]{background:#9FB9BF;cursor:default}
.done{display:inline-block;min-height:44px;line-height:44px;padding:0 14px;border-radius:10px;background:var(--lime-soft);color:var(--lime-dark);font-weight:700}
.have{margin:0;padding:0;list-style:none;display:flex;flex-wrap:wrap;gap:8px}
.have li{background:var(--soft);color:var(--ink);border-radius:999px;padding:4px 14px}
.note{color:var(--sub)}
.url{word-break:break-all;background:var(--bg);border:1px solid var(--line);border-radius:10px;padding:10px 12px}
.msg{min-height:28px;color:var(--ink)}
.err{color:#8E3B3B}
[hidden]{display:none!important}
</style>
</head>
<body>
<div class="band">試作（テスト決済・値段は仮置き）</div>
<main>
<h1>2027の商品を買ってみる</h1>
<p class="msg" id="msg" role="status">読み込み中</p>

<section id="guest" hidden>
  <div class="card">
    <p>LINEの中で開いてください。</p>
    <p class="url">https://liff.line.me/2011606963-hH0DzETc/kounyu-test.html</p>
  </div>
</section>

<section id="mine" hidden>
  <h2>いま持っている権利</h2>
  <ul class="have" id="have"></ul>
  <p class="note" id="havenone" hidden>まだありません。</p>
</section>

<section id="shop" hidden>
  <h2>商品</h2>
  <div id="list"></div>
  <p class="note">テストカードは 4242 4242 4242 4242（期限は未来の日付、CVCは任意）。</p>
</section>
</main>
<script>
(function(){
  'use strict';
  var LIFF_ID='2011606963-hH0DzETc';
  var $=function(id){return document.getElementById(id);};
  var state={user:null,ents:[],products:[],includes:{}};
  var OLD={ume:'学習カルテ（旧）',take:'竹（旧）',matsu:'松（旧）',matome:'要点まとめと問題'};
  var qs=new URLSearchParams(location.search);

  function say(t,err){var m=$('msg');m.textContent=t||'';m.className='msg'+(err?' err':'');}
  function api(path,opt){
    opt=opt||{};opt.credentials='same-origin';opt.cache='no-store';
    return fetch(path,opt).then(function(r){return r.json().catch(function(){return {};}).then(function(j){return {status:r.status,json:j||{}};});});
  }
  function yen(n){return String(n).replace(/\B(?=(\d{3})+(?!\d))/g,',')+'円';}
  function load(src){return new Promise(function(ok,ng){var s=document.createElement('script');s.src=src;s.onload=ok;s.onerror=function(){ng(new Error('sdk'));};document.head.appendChild(s);});}

  function planName(plan){
    if(OLD[plan])return OLD[plan];
    for(var i=0;i<state.products.length;i++)if(state.products[i].plan===plan)return state.products[i].name;
    return plan;
  }
  // 含む関係で広げた plan の一覧（サーバーの lib/products.js と同じ表を /api/products から受け取る）
  function expanded(){
    var set={};
    state.ents.forEach(function(e){(state.includes[e.plan]||[e.plan]).forEach(function(p){set[p]=true;});});
    return Object.keys(set);
  }
  function render(){
    var have=expanded();
    var ul=$('have');ul.textContent='';
    have.forEach(function(p){var li=document.createElement('li');li.textContent=planName(p);ul.appendChild(li);});
    $('havenone').hidden=have.length>0;
    var list=$('list');list.textContent='';
    state.products.forEach(function(p){
      var card=document.createElement('div');card.className='card';
      var row=document.createElement('div');row.className='row';
      var left=document.createElement('div');
      var n=document.createElement('div');n.className='name';n.textContent=p.name;
      var pr=document.createElement('div');pr.className='price';pr.textContent=yen(p.price)+'（仮）';
      left.appendChild(n);left.appendChild(pr);row.appendChild(left);
      if(have.indexOf(p.plan)>=0){
        var d=document.createElement('span');d.className='done';d.textContent='購入済み';row.appendChild(d);
      }else{
        var b=document.createElement('button');b.type='button';b.textContent='テスト決済へ';
        b.addEventListener('click',function(){buy(p.code,b);});row.appendChild(b);
      }
      card.appendChild(row);list.appendChild(card);
    });
    $('mine').hidden=false;$('shop').hidden=false;
  }
  function buy(code,btn){
    btn.disabled=true;say('決済ページを準備しています');
    api('/api/checkout',{method:'POST',headers:{'Content-Type':'application/json','X-Mimiobo-User':state.user},body:JSON.stringify({product:code})}).then(function(r){
      if(r.status===200&&r.json.url){location.href=r.json.url;return;}
      btn.disabled=false;
      say(r.status===503?'この商品の価格がまだ用意されていません（'+(r.json.error||'')+'）':'始められませんでした（'+r.status+(r.json.error?'：'+r.json.error:'')+'）',true);
    }).catch(function(){btn.disabled=false;say('通信できませんでした',true);});
  }
  function readSession(){
    return api('/api/session').then(function(r){
      if(r.status!==200||!r.json.userId)return false;
      state.user=r.json.userId;state.ents=Array.isArray(r.json.entitlements)?r.json.entitlements:[];return true;
    });
  }
  // 決済から戻った直後：権利がつくまで2秒おき・最大10回読み直す
  function waitForEntitlement(){
    var code=qs.get('product'),product=null,tries=0;
    state.products.forEach(function(p){if(p.code===code)product=p;});
    if(!product)return Promise.resolve();
    say('権利がつくのを確認しています');
    return new Promise(function(done){
      (function loop(){
        if(expanded().indexOf(product.plan)>=0){say('購入できました。');render();return done();}
        if(tries>=10){say('まだ反映されていません。少し待ってから開き直してください。',true);return done();}
        tries++;
        setTimeout(function(){readSession().then(function(){render();loop();});},2000);
      })();
    });
  }
  function lineLogin(){
    return load('https://static.line-scdn.net/liff/edge/2/sdk.js').then(function(){return liff.init({liffId:LIFF_ID});}).then(function(){
      if(!liff.isLoggedIn())return false;
      var token=null;try{token=liff.getIDToken();}catch(_){}
      if(!token)return false;
      return api('/api/session',{method:'POST',headers:{'Content-Type':'application/json'},body:JSON.stringify({idToken:token})}).then(function(r){return r.status===200;});
    }).catch(function(){return false;});
  }
  function start(){
    api('/api/products').then(function(r){
      if(r.status!==200||!Array.isArray(r.json.products))throw new Error('products');
      state.products=r.json.products;state.includes=r.json.includes||{};
      return readSession();
    }).then(function(ok){
      if(ok)return true;
      return lineLogin().then(function(done){return done?readSession():false;});
    }).then(function(ok){
      if(!ok){say('');$('guest').hidden=false;return;}
      say(qs.get('checkout')==='cancel'?'決済を中止しました。':'');
      render();
      if(qs.get('checkout')==='ok')return waitForEntitlement();
    }).catch(function(){say('読み込めませんでした。開き直してください。',true);});
  }
  start();
})();
</script>
</body>
</html>
