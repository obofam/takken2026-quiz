</div>
<div id="noEntitlement" class="card" hidden>
<h1>学習カルテは準備中です</h1>
<p>記録をためて弱点を見る画面です。今はテスト中で、仕組みの確認だけをしています。</p>
<div class="actions"><button id="buy" class="primary" type="button">学習カルテを試す（テスト決済）</button><a class="secondary" href="plans-preview.html#ume">学習カルテの案内を見る</a></div>
<p class="small muted">テスト用のカードでしか決済できません。実際の請求はありません。</p>
<p id="buyMessage" class="small" role="status" aria-live="polite"></p>
</div>
<div id="entitled" class="card" hidden>
<h1>学習カルテ <span class="badge">テスト中</span></h1>
<p>この画面は Sprint 3 で記録から作ります。今は権利の確認だけです。</p>
<p id="untilRow" class="fact" hidden>有効期限：<span id="until"></span></p>
<p><a class="textbutton" href="ep10-preview.html">3問チェックに戻る</a></p>
</div>
</div></section>
</main>
<script>
'use strict';
const $=id=>document.getElementById(id);
const PLAN='ume',POLL_MS=3000,POLL_MAX=5;
let userId='';
const msg=code=>window.MimioboMessages?.text(code)||'接続できませんでした。時間をおいてもう一度お試しください。';
function show(id){for(const x of ['needLogin','noEntitlement','entitled'])$(x).hidden=x!==id;}
function formatDate(value){
  const parts=Object.fromEntries(new Intl.DateTimeFormat('ja-JP',{timeZone:'Asia/Tokyo',year:'numeric',month:'numeric',day:'numeric'}).formatToParts(new Date(value)).map(p=>[p.type,p.value]));
  return parts.year+'年'+Number(parts.month)+'月'+Number(parts.day)+'日';
}
// The server decides: this page only displays what GET /api/session says. 401/403 = not logged in.
async function fetchSession(){
  const response=await fetch('/api/session',{credentials:'same-origin',signal:AbortSignal.timeout(15000)});
  if(response.status===401||response.status===403)return {loggedOut:true};
  if(!response.ok)throw Error('service_unavailable');
  return response.json();
}
const karteRight=data=>(Array.isArray(data.entitlements)?data.entitlements:[]).find(e=>e&&e.plan===PLAN);
function render(data){
  $('status').textContent='';
  if(data.loggedOut){show('needLogin');return;}
  userId=data.userId;
  const right=karteRight(data);
  if(!right){show('noEntitlement');return;}
  $('untilRow').hidden=!right.valid_until;
  if(right.valid_until)$('until').textContent=formatDate(right.valid_until);
  show('entitled');
}
const sleep=ms=>new Promise(resolve=>setTimeout(resolve,ms));
async function initialize(){
  try{await new Promise(resolve=>{const script=document.createElement('script');script.src='/ui-messages.js';script.onload=resolve;script.onerror=resolve;document.head.append(script);});}catch{}
  try{
    let data=await fetchSession();
    // Just back from Checkout: the webhook may not have arrived yet. Re-read a few times, then stop.
    if(new URLSearchParams(location.search).get('checkout')==='ok'&&!data.loggedOut&&!karteRight(data)){
      $('status').textContent='決済の反映を待っています…';
      for(let i=0;i<POLL_MAX&&!karteRight(data);i++){await sleep(POLL_MS);data=await fetchSession();if(data.loggedOut)break;}
      if(!data.loggedOut&&!karteRight(data)){$('status').textContent='反映に少し時間がかかっています。しばらくしてからこのページを開き直してください。';return;}
    }
    render(data);
  }catch(e){$('status').textContent=msg(e.message);}
}
$('buy').onclick=async()=>{
  $('buy').disabled=true;$('buyMessage').textContent='';
  try{
    const response=await fetch('/api/checkout',{method:'POST',credentials:'same-origin',headers:{'Content-Type':'application/json','X-Mimiobo-User':userId},body:'{}',signal:AbortSignal.timeout(15000)});
    const result=await response.json().catch(()=>({}));
    if(!response.ok||typeof result.url!=='string')throw Error(response.status===401?'SESSION_INVALID':'service_unavailable');
    location.href=result.url;
  }catch(e){$('buyMessage').textContent=msg(e.message);$('buy').disabled=false;}
};
initialize();
</script>
</body>
</html>
