<!DOCTYPE html>
<html lang="ja">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<meta name="robots" content="noindex, nofollow">
<title>Webの問題集（準備中）｜耳で覚える宅建2027</title>
<!-- Umami analytics (page: 問題集 入口) -->
<script defer src="https://cloud.umami.is/script.js" data-website-id="99a5370c-5fbd-4ceb-9d35-7734d7c580ec"></script>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link href="https://fonts.googleapis.com/css2?family=Noto+Sans+JP:wght@400;700;900&display=swap" rel="stylesheet">
<script>document.documentElement.classList.add("js");</script>
<style>
:root{--sky:#17C5E8;--ink:#0A6477;--soft:#E3F8FC;--mark:#B8EEF8;--bg:#F4FAFC;--text:#141B21;--sub:#6B6B76;--line:#DCEEF3;--font:"Noto Sans JP","Hiragino Sans","Yu Gothic",sans-serif;--shadow:0 2px 8px rgba(20,27,33,.05)}
*{box-sizing:border-box;margin:0;padding:0}
html{-webkit-text-size-adjust:100%}
html,body{background:var(--bg)}
body{font-family:var(--font);word-break:auto-phrase;overflow-wrap:anywhere;color:var(--text);line-height:1.5;font-size:16px;overflow-x:hidden}
.page{max-width:430px;margin:0 auto;padding:14px 16px 24px}
.page>*+*{margin-top:14px}
a{color:var(--ink);text-underline-offset:2px}
.smp-head{text-align:center;padding-top:6px}
.smp-tag{display:inline-block;font-size:13px;font-weight:700;color:var(--ink);background:var(--soft);border:1px solid var(--sky);border-radius:999px;padding:1px 14px;line-height:1.6}
.smp-h{font-size:22px;font-weight:900;line-height:1.4;margin-top:8px}
.smp-sub{font-size:15px;line-height:1.6;margin-top:4px;color:var(--ink);font-weight:700}
.smp-lead{font-size:15px;line-height:1.8;margin-top:8px;text-align:left}
.tx{font-size:16px;line-height:1.8}
.back{display:flex;align-items:center;justify-content:center;min-height:48px;padding:0 16px;border-radius:999px;border:1.5px solid var(--sky);background:#fff;color:var(--ink);font-size:15px;font-weight:700;text-decoration:none}
.back:active{background:var(--soft)}
.back:focus-visible,.pill:focus-visible{outline:2px solid var(--sky);outline-offset:2px}
.stack{display:flex;flex-direction:column;gap:10px}
.small-links{display:flex;flex-direction:column;align-items:center;gap:6px;font-size:14px;line-height:1.6}
.small-links a{display:inline-block;padding:6px 4px}
.foot{font-size:14px;line-height:1.4;color:#4F5963;text-align:center}
.k{color:var(--ink);font-weight:700;background:linear-gradient(transparent 58%,var(--mark) 58%);-webkit-box-decoration-break:clone;box-decoration-break:clone}
.c{font-size:14px;color:var(--sub);font-weight:400}
.qcard{background:#fff;border:1px solid var(--line);border-radius:14px;box-shadow:var(--shadow);padding:14px 14px 16px}
.qhead{display:flex;gap:10px;align-items:flex-start}
.qno{flex:none;font-weight:900;color:var(--ink);background:var(--soft);border-radius:999px;font-size:13px;line-height:1;padding:6px 10px;margin-top:5px;white-space:nowrap}
.qtext{margin:0;font-size:16px;line-height:1.8}
.qbtns{display:none;gap:10px;margin-top:12px}
.js .qbtns{display:flex}
.pill{font:inherit;font-size:17px;font-weight:700;line-height:1.2;color:var(--ink);background:#fff;border:1.5px solid var(--sky);border-radius:999px;flex:1 1 0;min-width:0;min-height:48px;padding:10px 12px;cursor:pointer}
.pill:hover:not(:disabled){background:var(--soft)}
.pill:disabled{cursor:default;color:var(--sub);border-color:var(--line);background:#fafafa}
.pill.chosen:disabled{color:var(--ink);border-color:var(--sky);background:var(--soft)}
.pill.right:disabled{color:#fff;background:var(--ink);border-color:var(--ink)}
.res{margin-top:12px;padding:12px 14px;border-radius:12px;font-size:15px;line-height:1.8;background:var(--bg);border:1px solid var(--line)}
.js .res{display:none}
.js .qcard.done .res{display:block}
.res.ok{background:var(--soft);border-color:var(--sky)}
.res .verdict{font-weight:900;font-size:17px;color:var(--ink)}
.res .ng-v{color:#4F5963}
.res .answer{font-weight:700}
.res .right-form{margin-top:6px}
.res .exp{margin-top:8px}
.res .src{text-align:right;font-size:14px;color:var(--sub);line-height:1.4;margin-top:6px}
.tg{flex:0 0 auto;display:inline-block;width:30px;text-align:center;font-size:14px;font-weight:900;border-radius:6px;line-height:1.6;margin-top:3px}
.tg.ng{background:#EEF0F2;border:1.5px solid #9AA3AB;color:#5A626B}
.tg.ok{background:var(--ink);border:1.5px solid var(--ink);color:#fff}
.score{display:none;text-align:center;font-size:17px;font-weight:900;color:var(--ink);background:#fff;border:1.5px solid var(--sky);border-radius:14px;padding:14px}
.score.show{display:block}
.it{display:flex;gap:8px;font-size:16px;line-height:1.75;margin-top:8px;align-items:flex-start}
.it .in{flex:0 0 1.5em;font-weight:700;color:var(--ink)}
.it .itx{flex:1;min-width:0}
.sup{margin-top:6px;font-size:15px}
.ex{display:flex;gap:8px;align-items:flex-start;padding:10px 0 0;margin-top:10px;border-top:1px solid var(--line)}
.ex .en{flex:0 0 1.5em;font-size:16px;font-weight:900;color:var(--ink);line-height:1.7}
.ex .etx{flex:1;min-width:0;font-size:15px;line-height:1.7}
.ex .tg{margin-top:2px}
.ex .etx .src{text-align:right;font-size:14px;color:var(--sub);line-height:1.4;margin-top:4px}
@media (min-width:820px){.page{max-width:520px}}
</style>
</head>
<body>
<main class="page">
<header class="smp-head"><span class="smp-tag">準備中</span><h1 class="smp-h">Webの問題集</h1></header><p class="tx">「要点まとめと問題」を購入した方の専用ページです。</p><p class="tx">ひっかけ注意の○×と過去問を、スマホで解けます。いま準備しています。</p><p class="tx">第1回は、どなたでも解けます。</p><div class="stack"><a class="back" href="/mondai/1/marubatsu">第1回 ひっかけ○×</a><a class="back" href="/mondai/1/kakomon">第1回 過去問</a></div><div class="small-links"><a href="/mihon/youten-1">第1回の見本（要点まとめと問題）</a><a href="/roadmap">ロードマップへ</a></div><p class="foot">耳で覚える宅建 2027</p>
</main>
</body>
</html>
