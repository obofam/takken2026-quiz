<div data-slot="fig1">
<div class="tx" data-fig="1"><figure class="fig">
    <div class="cap"><span class="n">1</span>家を売りたい人は、どれにする？<span class="capsub">選ぶのは依頼者</span></div>
    <div class="mt">
      <div class="k" style="grid-column:1/3">縛りの強さ</div>
      <div class="hh h1">一般媒介<span class="sig s1"><i></i><i></i><i></i></span></div>
      <div class="hh h2">専任媒介<span class="sig s2"><i></i><i></i><i></i></span></div>
      <div class="hh h3">専属専任媒介<span class="sig s3"><i></i><i></i><i></i></span></div>

      <div class="vb" style="grid-row:2/4;grid-column:1">依頼者</div>
      <div class="vb" style="grid-row:4/9;grid-column:1">業者の義務</div>

      <div class="k">ほかの業者にも頼める</div>
      <div class="c g1"><span class="pill ok">できる</span></div>
      <div class="c g2"><span class="pill ng">できない</span></div>
      <div class="c g3"><span class="pill ng">できない</span></div>
      <div class="k">自分で見つけた相手と契約<small>自己発見取引</small></div>
      <div class="c g1"><span class="pill ok">できる</span></div>
      <div class="c g2"><span class="pill ok">できる</span></div>
      <div class="c g3"><span class="pill ng">できない</span></div>

      <div class="k">有効期間</div>
      <div class="c g1">法律上の制限なし</div>
      <div class="c g2"><span><span class="num">3か月</span>まで</span></div>
      <div class="c g3"><span><span class="num">3か月</span>まで</span></div>
      <div class="k">レインズへの登録<small>休業日を除く</small></div>
      <div class="c g1">義務なし</div>
      <div class="c g2"><span><span class="num">7日</span>以内</span></div>
      <div class="c g3"><span><span class="num">5日</span>以内</span></div>
      <div class="k">定期の報告</div>
      <div class="c g1">義務なし</div>
      <div class="c g2"><span><span class="num">2週間</span>に1回以上</span></div>
      <div class="c g3"><span><span class="num">1週間</span>に1回以上</span></div>
      <div class="k">買いたい申込みがあったら</div>
      <div class="c full">3つとも、遅滞なく依頼者に報告（定期の報告とは別）</div>
    </div>
    <div class="chips">
      <div class="chip" style="flex:1.25">専任・専属専任は、6か月と決めても無効ではなく<b>3か月</b>に。更新は<b class="nw">依頼者の申出</b>で、更新後も3か月まで</div>
      <div class="chip" style="flex:.95">期間・登録・報告に反する特約は<b>無効</b>。<span class="nw">申出がないのに</span>自動で更新する特約も無効</div>
    </div>
  </figure></div>
</div>
